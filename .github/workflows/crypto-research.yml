name: Riset Strategi Crypto

# Uji ulang upgrade strategi (vol targeting, tren + on-chain, keranjang meme) dengan data terbaru.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  riset:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install numpy
      - name: Uji varian strategi crypto
        run: python tools/crypto_research.py
