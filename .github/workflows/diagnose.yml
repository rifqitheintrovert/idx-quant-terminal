name: Diagnosa Backtest

on:
  workflow_dispatch:
    inputs:
      only:
        description: "Hanya jalankan varian dengan awalan ini (pisah koma), kosong = semua"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  diagnosa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Ambil cache histori harga terakhir
        uses: actions/cache/restore@v4
        with:
          path: |
            .cache
            ~/.cache/py-yfinance
          key: idxq-data-none
          restore-keys: idxq-data-
      - name: Bedah drawdown backtest
        env:
          DIAG_ONLY: ${{ inputs.only }}
        run: python -m engine.diagnose --cache .cache/panels.pkl
