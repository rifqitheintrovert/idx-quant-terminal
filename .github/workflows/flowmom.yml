name: Riset Momentum + Inflow

on:
  workflow_dispatch:
    inputs:
      pick:
        description: "Pilihan manual flow,mom,bobot,syarat,exit,ambang (mis. C,B,w1,g2,x0,60); kosong = otomatis"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  riset:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Ambil cache histori harga terakhir
        uses: actions/cache/restore@v4
        with:
          path: |
            .cache
            ~/.cache/py-yfinance
          key: idxq-data-none
          restore-keys: idxq-data-
      - name: Uji varian momentum + akumulasi inflow
        env:
          FM_PICK: ${{ inputs.pick }}
        run: python -m engine.flowmom --cache .cache/panels.pkl
