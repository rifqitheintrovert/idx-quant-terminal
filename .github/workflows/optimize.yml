name: Optimasi Portofolio

on:
  workflow_dispatch:
    inputs:
      pick:
        description: "Bobot CUR,MIN,MR25,EMAS (mis. 0.34,0.33,0,0.33); kosong = otomatis"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  optimasi:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Ambil cache histori harga terakhir
        uses: actions/cache/restore@v4
        with:
          path: |
            .cache
            ~/.cache/py-yfinance
          key: idxq-data-none
          restore-keys: idxq-data-
      - name: Cari kombinasi CAGR tinggi - drawdown rendah
        env:
          OPT_PICK: ${{ inputs.pick }}
        run: python -m engine.optimize --cache .cache/panels.pkl
