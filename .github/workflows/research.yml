name: Riset Strategi

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  riset:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Ambil cache histori harga terakhir
        uses: actions/cache/restore@v4
        with:
          path: |
            .cache
            ~/.cache/py-yfinance
          key: idxq-data-none
          restore-keys: idxq-data-
      - name: Uji strategi frekuensi rendah
        run: python -m engine.research --cache .cache/panels.pkl
